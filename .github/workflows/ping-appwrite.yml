name: Appwrite Health Heartbeat

on:
  schedule:
    # Runs every 3 days at midnight UTC
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-health:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          curl -f https://cloud.appwrite.io/v1/health/ping \
            -H "X-Appwrite-Project: 6a5b392400378bf45266"
